syntax = "proto3";

package protocol;

message Position
{
    float x = 1;
    float y = 2;
    float z = 3;
}

message PositionUpdateRequest
{
    uint64 room_id = 1;
    Position position = 2;
}

message PositionUpdateResponse
{
}

message PlayerPosition
{
    uint64 player_id = 1;
    Position position = 2;
}

message RoomPositions
{
    uint64 room_id = 1;
    uint64 tick = 2;
    repeated PlayerPosition players = 3;
}
